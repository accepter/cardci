<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card CI — 卡片式筆記</title>
  <style>
    /* ═══════════════════════════════════════════
       CSS Reset & Design Tokens
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f5f5;
      --surface:     #ffffff;
      --border:      #e2e2e2;
      --text:        #2c2c2c;
      --text-muted:  #6e6e6e;
      --text-faint:  #a0a0a0;
      --accent:      #15c39a;
      --accent-hover:#12a885;
      --radius:      14px;
      --radius-sm:   10px;
      --shadow-sm:   0 1px 4px rgba(0,0,0,.07);
      --shadow-md:   0 4px 16px rgba(0,0,0,.10);
      --shadow-lg:   0 8px 30px rgba(0,0,0,.12);
      --transition:  .2s cubic-bezier(.4,0,.2,1);

      /* Card palette — soft, pastel tones */
      --c-default:  #ffffff;
      --c-gray:     #f0f0f0;
      --c-yellow:   #fff8dc;
      --c-green:    #e8f5e9;
      --c-pink:     #fce4ec;
      --c-blue:     #e3f2fd;
      --c-purple:   #f3e5f5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════
       Navbar
    ═══════════════════════════════════════════ */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .navbar-logo {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 1rem;
      color: #fff;
      flex-shrink: 0;
    }
    .navbar-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .navbar-subtitle {
      font-size: .72rem;
      color: var(--text-muted);
      margin-top: -1px;
    }

    .btn-login {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
    }
    .btn-login:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 3px rgba(21,195,154,.12);
    }

    /* ═══════════════════════════════════════════
       Hero / Intro
    ═══════════════════════════════════════════ */
    .hero {
      text-align: center;
      padding: 48px 24px 32px;
      max-width: 560px;
      margin: 0 auto;
    }
    .hero h2 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      color: var(--text-muted);
      font-size: .95rem;
      line-height: 1.7;
    }

    /* ═══════════════════════════════════════════
       Create Card Form
    ═══════════════════════════════════════════ */
    .create-section {
      max-width: 680px;
      margin: 0 auto 40px;
      padding: 0 20px;
    }
    .create-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 22px 24px;
      border: 1px solid var(--border);
    }
    .create-card label.section-label {
      display: block;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-faint);
      margin-bottom: 10px;
    }

    .input-title {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid var(--border);
      border-radius: 0;
      padding: 10px 2px;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: inherit;
      background: transparent;
      outline: none;
      color: var(--text);
      transition: border-color var(--transition);
    }
    .input-title::placeholder { color: var(--text-faint); }
    .input-title:focus { border-bottom-color: var(--accent); }

    .input-content {
      width: 100%;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: .95rem;
      font-family: inherit;
      background: var(--bg);
      outline: none;
      resize: none;
      min-height: 110px;
      color: var(--text);
      transition: background var(--transition), box-shadow var(--transition);
      margin-top: 12px;
    }
    .input-content::placeholder { color: var(--text-faint); }
    .input-content:focus {
      background: var(--surface);
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    /* Options row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* Color picker */
    .color-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-picker span.pick-label {
      font-size: .82rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .color-dots {
      display: flex;
      gap: 7px;
    }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition);
      position: relative;
    }
    .color-dot:hover { transform: scale(1.18); }
    .color-dot.active {
      border-color: var(--accent);
      transform: scale(1.12);
      box-shadow: 0 0 0 3px rgba(21,195,154,.18);
    }
    .color-dot[data-color="default"]  { background: #ffffff; border-color: #d0d0d0; }
    .color-dot[data-color="gray"]     { background: #ececec; }
    .color-dot[data-color="yellow"]   { background: #fff8dc; }
    .color-dot[data-color="green"]    { background: #dcedc8; }
    .color-dot[data-color="pink"]     { background: #f8bbd0; }
    .color-dot[data-color="blue"]     { background: #bbdefb; }
    .color-dot[data-color="purple"]   { background: #e1bee7; }

    /* Pin toggle */
    .pin-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: .88rem;
      color: var(--text-muted);
      user-select: none;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      transition: all var(--transition);
    }
    .pin-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .pin-toggle input { cursor: pointer; width: 15px; height: 15px; accent-color: var(--accent); }

    /* Submit */
    .btn-submit {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 26px;
      border-radius: 22px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
      box-shadow: 0 2px 8px rgba(21,195,154,.3);
    }
    .btn-submit:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 14px rgba(21,195,154,.38);
      transform: translateY(-1px);
    }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ═══════════════════════════════════════════
       Cards Grid (Masonry-style via column-count)
    ═══════════════════════════════════════════ */
    .cards-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    .cards-section h3 {
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-faint);
      margin-bottom: 18px;
      padding-left: 4px;
    }

    .masonry {
      column-count: 4;
      column-gap: 16px;
    }
    @media (max-width: 1100px) { .masonry { column-count: 3; } }
    @media (max-width: 760px)  { .masonry { column-count: 2; } }
    @media (max-width: 420px)  { .masonry { column-count: 1; } }

    /* Individual card */
    .card {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
      position: relative;
      transition: box-shadow var(--transition), transform var(--transition);
      animation: cardIn .3s ease both;
      border: 1px solid rgba(0,0,0,.06);
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card.pinned::after {
      content: '📌';
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: .85rem;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.15));
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
      word-break: break-word;
      line-height: 1.4;
    }
    .card-body {
      font-size: .9rem;
      color: var(--text-muted);
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.65;
    }
    .card-footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,.06);
      font-size: .73rem;
      color: var(--text-faint);
      text-align: right;
      letter-spacing: .02em;
    }

    /* Card background colors */
    .card[data-color="default"]  { background: var(--c-default);  }
    .card[data-color="gray"]     { background: var(--c-gray);     }
    .card[data-color="yellow"]   { background: var(--c-yellow);   }
    .card[data-color="green"]    { background: var(--c-green);    }
    .card[data-color="pink"]     { background: var(--c-pink);     }
    .card[data-color="blue"]     { background: var(--c-blue);     }
    .card[data-color="purple"]   { background: var(--c-purple);   }

    /* Stagger animation delays */
    .card:nth-child(1)  { animation-delay: .03s; }
    .card:nth-child(2)  { animation-delay: .06s; }
    .card:nth-child(3)  { animation-delay: .09s; }
    .card:nth-child(4)  { animation-delay: .12s; }
    .card:nth-child(5)  { animation-delay: .15s; }
    .card:nth-child(6)  { animation-delay: .18s; }
    .card:nth-child(7)  { animation-delay: .21s; }
    .card:nth-child(8)  { animation-delay: .24s; }
    .card:nth-child(n+9){ animation-delay: .27s; }

    /* ═══════════════════════════════════════════
       Loading & Empty States
    ═══════════════════════════════════════════ */
    .state-wrap {
      text-align: center;
      padding: 80px 20px;
    }
    .state-icon {
      font-size: 3rem;
      margin-bottom: 14px;
      opacity: .6;
    }
    .state-text {
      color: var(--text-muted);
      font-size: .95rem;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════
       Toast
    ═══════════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2d2d2d;
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: .88rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 999;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <a class="navbar-brand" href="#">
      <div class="navbar-logo">🗂</div>
      <div>
        <div class="navbar-title">Card CI</div>
        <div class="navbar-subtitle">卡片式筆記系統</div>
      </div>
    </a>
    <a class="btn-login" href="login.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      登入
    </a>
  </nav>

  <!-- ── Hero ───────────────────────────────────────────────── -->
  <section class="hero">
    <h2>記錄每一箇中想法 ✨</h2>
    <p>Card CI 是一個簡潔的卡片式筆記系統，<br />像 Google Keep 一樣，用明亮的色彩與釘選功能，<br />讓你的靈感井然有序。</p>
  </section>

  <!-- ── Create Card Form ───────────────────────────────────── -->
  <section class="create-section">
    <div class="create-card">
      <label class="section-label">新增筆記</label>
      <input
        type="text"
        class="input-title"
        id="inputTitle"
        placeholder="標題（可選）"
        maxlength="255"
      />
      <textarea
        class="input-content"
        id="inputContent"
        placeholder="撰寫你的筆記內容…"
        rows="4"
      ></textarea>

      <div class="form-options">
        <div class="color-picker">
          <span class="pick-label">顏色</span>
          <div class="color-dots">
            <div class="color-dot active" data-color="default" title="白色"></div>
            <div class="color-dot"      data-color="gray"    title="灰色"></div>
            <div class="color-dot"      data-color="yellow"  title="柔黃"></div>
            <div class="color-dot"      data-color="green"   title="淡綠"></div>
            <div class="color-dot"      data-color="pink"    title="粉紅"></div>
            <div class="color-dot"      data-color="blue"    title="淺藍"></div>
            <div class="color-dot"      data-color="purple"  title="淡紫"></div>
          </div>
        </div>

        <label class="pin-toggle">
          <input type="checkbox" id="inputPin" />
          📌 釘選
        </label>

        <button class="btn-submit" id="submitBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          發布
        </button>
      </div>
    </div>
  </section>

  <!-- ── Cards Grid ─────────────────────────────────────────── -->
  <main class="cards-section">
    <h3>所有筆記</h3>
    <div class="masonry" id="cardsGrid"></div>
    <div id="stateWrap" class="state-wrap" style="display:none;">
      <div class="state-icon" id="stateIcon">⏳</div>
      <div class="state-text" id="stateText">載入中…</div>
    </div>
  </main>

  <!-- ── Toast ──────────────────────────────────────────────── -->
  <div class="toast" id="toast"></div>

  <script>
    // ═══════════════════════════════════════════
    //  API 設定
    // ═══════════════════════════════════════════
    const API_BASE = 'https://api.card.ci/api.php';

    let selectedColor = 'default';

    // ── 顏色選擇器 ──────────────────────────────────────────────
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        selectedColor = dot.dataset.color;
      });
    });

    // ── Toast 提示 ──────────────────────────────────────────────
    function showToast(msg, duration = 2800) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), duration);
    }

    // ── 工具函式 ────────────────────────────────────────────────
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('zh-TW', {
        year:  'numeric', month: '2-digit', day: '2-digit',
        hour:  '2-digit', minute: '2-digit'
      });
    }

    // ── 載入卡片列表 ────────────────────────────────────────────
    async function loadCards() {
      const grid  = document.getElementById('cardsGrid');
      const state = document.getElementById('stateWrap');
      const icon  = document.getElementById('stateIcon');
      const text  = document.getElementById('stateText');

      // 顯示載入狀態
      grid.innerHTML = '';
      state.style.display = '';
      icon.textContent = '⏳';
      text.textContent = '載入中…';

      try {
        const res  = await fetch(API_BASE, { method: 'GET' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();

        if (!json.success) throw new Error(json.message);

        const cards = json.cards ?? [];

        if (cards.length === 0) {
          icon.textContent = '📭';
          text.textContent = '尚無筆記，來發布第一篇吧！';
          return;
        }

        state.style.display = 'none';

        grid.innerHTML = cards.map(card => `
          <article
            class="card ${card.is_pinned ? 'pinned' : ''}"
            data-color="${card.color}"
          >
            ${card.title
              ? `<h2 class="card-title">${escapeHtml(card.title)}</h2>`
              : ''
            }
            <p class="card-body">${escapeHtml(card.content)}</p>
            <div class="card-footer">
              ${formatDate(card.created_at)}
              ${card.is_pinned ? ' · 已釘選' : ''}
            </div>
          </article>
        `).join('');
      } catch (err) {
        icon.textContent = '⚠️';
        text.textContent = '載入失敗，請稍後再試。';
        console.error('[loadCards]', err);
      }
    }

    // ── 發布新卡片 ──────────────────────────────────────────────
    async function publishCard() {
      const title     = document.getElementById('inputTitle').value.trim();
      const content   = document.getElementById('inputContent').value.trim();
      const isPinned  = document.getElementById('inputPin').checked;
      const btn       = document.getElementById('submitBtn');

      if (!content) {
        showToast('⚠️ 請輸入筆記內容');
        document.getElementById('inputContent').focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> 發布中…';

      try {
        const res  = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, color: selectedColor, is_pinned: isPinned }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();

        if (!json.success) throw new Error(json.message);

        // 清空表單
        document.getElementById('inputTitle').value     = '';
        document.getElementById('inputContent').value   = '';
        document.getElementById('inputPin').checked     = false;
        selectedColor = 'default';
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        document.querySelector('.color-dot[data-color="default"]').classList.add('active');

        showToast('✅ 發布成功！');
        loadCards();
      } catch (err) {
        showToast('❌ 發布失敗：' + err.message);
        console.error('[publishCard]', err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          發布`;
      }
    }

    document.getElementById('submitBtn').addEventListener('click', publishCard);

    // ── 啟動 ────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', loadCards);
  </script>
</body>
</html>
